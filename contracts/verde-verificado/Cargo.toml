[package]
name = "greenledger"
version = "2.0.0"
edition = "2021"
description = "GreenLedger v2 — registro de créditos de carbono no fungibles en Soroban (Stellar)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Perfil auxiliar para depurar con logs activos sin perder las demás
# optimizaciones de "release" (útil al investigar fallos en testnet).
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
